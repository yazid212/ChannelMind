name: CI

on:
  pull_request:
  push:
    branches: [main, "staging/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt -r requirements-api.txt -r requirements-dev.txt
      - run: python -m compileall -q api app src config.py
      - run: python -m pytest tests -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: node --test extension/tests/*.test.mjs
        working-directory: .

  api-image:
    if: startsWith(github.ref, 'refs/heads/staging/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --file Dockerfile.api --tag channelmind-api:staging .
      - run: docker run --rm --env APP_ENV=development --entrypoint python channelmind-api:staging -c "import api.main; print('api import ok')"
